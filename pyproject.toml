[project]
name = "watchdog-timer"
version = "0.1.1"
description = "Schedules a function to run after a delay, cancellable before it fires."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
